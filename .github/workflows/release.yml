name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and republish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}

jobs:
  check:
    name: Verify tagged source
    uses: ./.github/workflows/check.yml
    with:
      checkout_ref: ${{ inputs.release_tag || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      verify_release_version: true

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            os: darwin
            arch: amd64
            extension: dylib
          - target: darwin-arm64
            runner: macos-15
            os: darwin
            arch: arm64
            extension: dylib
          - target: linux-amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            extension: so
            image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            extension: so
            image: quay.io/pypa/manylinux2014_aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native runner architecture
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: Restore manylinux build cache
        if: matrix.os == 'linux'
        uses: actions/cache@v5
        with:
          path: .cache/manylinux-${{ matrix.arch }}
          key: manylinux2014-${{ matrix.arch }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go', 'internal/plugin/web/**') }}
          restore-keys: |
            manylinux2014-${{ matrix.arch }}-

      - name: Build macOS plugin
        if: matrix.os == 'darwin'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH="$TARGET_ARCH" \
            go build -buildvcs=false -tags cshared -buildmode=c-shared \
            -o dist/cpa-key-billing.dylib ./cmd/cpa-key-billing
          rm -f dist/cpa-key-billing.h

      - name: Build Linux plugin with manylinux2014
        if: matrix.os == 'linux'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p dist
          go_root="$(go env GOROOT)"
          cache_root="$GITHUB_WORKSPACE/.cache/manylinux-${TARGET_ARCH}"
          mkdir -p "$cache_root/build" "$cache_root/mod"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$go_root:/opt/go:ro" \
            -e HOME=/tmp -e GOROOT=/opt/go -e TARGET_ARCH \
            -e GOCACHE="/src/.cache/manylinux-${TARGET_ARCH}/build" \
            -e GOMODCACHE="/src/.cache/manylinux-${TARGET_ARCH}/mod" \
            "$TARGET_IMAGE" \
            bash -euo pipefail -c '
              export PATH="$GOROOT/bin:$PATH"
              CGO_ENABLED=1 GOOS=linux GOARCH="$TARGET_ARCH" \
                go build -buildvcs=false -trimpath -ldflags="-s -w -buildid=" \
                -tags cshared -buildmode=c-shared \
                -o dist/cpa-key-billing.so ./cmd/cpa-key-billing
            '
          rm -f dist/cpa-key-billing.h

      - name: Verify and package plugin
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          binary="dist/cpa-key-billing.${EXTENSION}"
          test -s "$binary"
          file "$binary"
          version="${RELEASE_TAG#v}"

          release_archive="cpa-key-billing_${version}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          tar -czf "$release_archive" -C dist "cpa-key-billing.${EXTENSION}"

          store_archive="cpa-key-billing_${version}_${TARGET_OS}_${TARGET_ARCH}.zip"
          zip -j "$store_archive" "$binary"
          test "$(unzip -Z1 "$store_archive")" = "cpa-key-billing.${EXTENSION}"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            cpa-key-billing_*_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            cpa-key-billing_*_${{ matrix.os }}_${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - check
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum cpa-key-billing_*.tar.gz cpa-key-billing_*.zip | sort > checksums.txt

      - name: Extract release notes
        run: |
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' Changelog.md > release-assets/RELEASE_NOTES.md
          test -s release-assets/RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
